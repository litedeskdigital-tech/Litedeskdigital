name: UEFA probe (temporary)

# Manual-only. Runs this branch's update end to end and prints what it imported. Commits nothing.
# To be removed before the importer is merged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run update -- --no-tune
      - name: Show import
        run: |
          set +e
          echo "::group::uefa-import.json"; cat data/uefa-import.json; echo "::endgroup::"
          echo "::group::matches by comp/season (played/total)"
          node -e '
            const d = JSON.parse(require("fs").readFileSync("data/matches.json","utf8"));
            const c = {}; for (const m of d.matches) { const k = m.comp+" "+m.season+" "+m.source; c[k] = c[k] || [0,0]; c[k][1]++; if (m.ft) c[k][0]++; }
            for (const k of Object.keys(c).sort()) console.log(k, c[k].join("/"));
            const cl = d.matches.filter(m => m.comp==="cl" && m.season==="2026-27");
            console.log("--- cl 2026-27 matchday 3");
            for (const m of cl.filter(m => m.matchday===3)) console.log(m.date, m.home, "v", m.away, m.ft ? m.ft.home+"-"+m.ft.away : "open", m.source);
            console.log("--- cl 2026-27 next fixtures"); for (const m of cl.filter(m => !m.ft).slice(0,12)) console.log(m.date, m.home, "v", m.away);
          '
          echo "::endgroup::"
          echo "::group::frozen CL predictions still match a database row"
          node -e '
            const d = JSON.parse(require("fs").readFileSync("data/matches.json","utf8"));
            const ids = new Set(d.matches.map(m => m.id));
            const p = JSON.parse(require("fs").readFileSync("data/predictions.json","utf8")).predictions.filter(x => x.comp==="cl");
            for (const x of p) console.log(ids.has(x.matchId) ? "ok " : "MISSING ", x.matchId, x.result ? "scored "+JSON.stringify(x.result) : "");
          '
          echo "::endgroup::"
          echo "::group::report"; grep -E "^Sources|log loss|League offsets" -A0 REPORT.md | cut -c1-600; sed -n '/## League offsets/,/## Strongest/p' REPORT.md; sed -n '/## Strongest/,$p' REPORT.md | head -16; grep -E "^\| 2026-10-2[1-3] \| cl" REPORT.md; echo "::endgroup::"
