name: Model update (every 30 minutes)

# Pulls fixtures and results (openfootball; UEFA Champions League, Europa League and Conference League) and, with
# Sportradar keys, team news, xG and odds for the UEFA matches; scores frozen predictions, updates ratings, refreshes the latest call
# for every fixture before kick-off, re-tunes when the prediction log shows a lasting slip (or every 60 days),
# commits data, model state and REPORT.md straight to main, then rebuilds and publishes the app to GitHub Pages.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      retune:
        description: "Re-tune the model settings now (e.g. after adding data sources)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: model-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Licensed Sportradar data lives only in this cache (private to the repo's Actions), never in git: each run
      # restores the newest copy and saves its own.
      - uses: actions/cache@v4
        with:
          path: .cache/sportradar
          key: sportradar-${{ github.run_id }}
          restore-keys: sportradar-
      - run: npm run update -- ${{ inputs.retune && '--retune' || '' }}
        env:
          # Optional: without them the update runs exactly as before.
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          SPORTRADAR_ODDS_KEY: ${{ secrets.SPORTRADAR_ODDS_KEY }}
          SPORTRADAR_ACCESS: ${{ vars.SPORTRADAR_ACCESS }}
      # The app feed is also committed (data/app.json) so the Android app can read it even without Pages.
      - run: npm run app:data && cp app/public/data/app.json data/app.json
      - name: Commit updated model
        run: |
          git config user.name "model-bot"
          git config user.email "model-bot@users.noreply.github.com"
          git add data model REPORT.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Model update $(date -u +'%F %H:%M') UTC"
            # Someone may have merged to main while this ran; the bot only touches data files, so a rebase is safe.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - run: npm run app:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    # Fails until GitHub Pages is enabled (Settings → Pages → Source: GitHub Actions). The Android app reads the
    # committed data/app.json, so this must not turn every half-hourly run red.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
