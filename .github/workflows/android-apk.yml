name: Android APK (EAS)

# Builds the standalone Android APK of mobile/ on Expo EAS: logs in with the EXPO_TOKEN secret if set, else with
# Expo device login (approve the link in the log, then put the number Expo shows in match-<run id>.txt on the
# expo-login branch), links the project to that account (once; the projectId is committed back), runs the Android export gate, builds the preview
# profile (internal APK), waits for FINISHED, downloads the artifact, checks it is a real APK (ZIP magic "PK")
# and attaches it to the run and to a GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Expo login (token, else device login)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "Using EXPO_TOKEN"; exit 0; fi
          unset EXPO_TOKEN
          # Device login: the link and code below are approved on expo.dev by the account owner, who reads back
          # the number Expo shows. That number arrives as the file match-<run id>.txt on the expo-login branch.
          npx -y eas-cli@latest login --device --non-interactive 2>&1 | tee "$RUNNER_TEMP/login.txt"
          REQ=$(grep -oiE 'resume[[:space:]]+[A-Za-z0-9_-]{8,}' "$RUNNER_TEMP/login.txt" | head -1 | awk '{print $2}')
          echo "request id: ${REQ:-not parsed}"
          # Job logs are only readable after the job ends, so publish the approval link where it can be read now.
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/login-${{ github.run_id }}.txt" \
            -d "$(node -e "const fs=require('fs');process.stdout.write(JSON.stringify({message:'Expo device login for run ${{ github.run_id }}',branch:'expo-login',content:Buffer.from(fs.readFileSync(process.env.RUNNER_TEMP+'/login.txt')).toString('base64')}))")" > /dev/null
          echo "Waiting for the approval number (file match-${{ github.run_id }}.txt on branch expo-login)..."
          for i in $(seq 1 90); do
            BODY=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${{ github.repository }}/contents/match-${{ github.run_id }}.txt?ref=expo-login" 2>/dev/null || true)
            if [ -n "$BODY" ]; then
              set -- $BODY
              if [ $# -ge 2 ]; then REQ=$1; NUM=$2; else NUM=$1; fi
              npx -y eas-cli@latest login --device --non-interactive --resume "$REQ" --match "$NUM"
              npx -y eas-cli@latest whoami --non-interactive
              exit 0
            fi
            sleep 10
          done
          echo "::error::No approval number arrived within 15 minutes"; exit 1
      - name: Expo account
        id: who
        run: |
          [ -n "$EXPO_TOKEN" ] || unset EXPO_TOKEN
          ACCOUNT=$(npx -y eas-cli@latest whoami --non-interactive | head -1 | tr -d '[:space:]')
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "Expo account: $ACCOUNT"
      - name: Link project (eas init) if needed
        run: |
          [ -n "$EXPO_TOKEN" ] || unset EXPO_TOKEN
          if node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "Already linked: $(node -p "require('./app.json').expo.extra.eas.projectId")"
          else
            npx -y eas-cli@latest init --account "${{ steps.who.outputs.account }}" --non-interactive --force
            git config user.name "release-bot"
            git config user.email "release-bot@users.noreply.github.com"
            git add app.json
            git commit -m "Link mobile app to Expo project $(node -p "require('./app.json').expo.extra.eas.projectId")"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Export gate
        run: npx expo export --platform android 2>&1 | tee "$RUNNER_TEMP/export.log" && grep -q "Android Bundled" "$RUNNER_TEMP/export.log" && rm -rf dist
      - name: Build (preview APK)
        id: build
        run: |
          [ -n "$EXPO_TOKEN" ] || unset EXPO_TOKEN
          npx -y eas-cli@latest build --platform android --profile preview --non-interactive --no-wait --json \
            --message "UCL Match Model standalone APK" > "$RUNNER_TEMP/build.json"
          cat "$RUNNER_TEMP/build.json"
          BUILD_ID=$(node -p "const b=require(process.env.RUNNER_TEMP+'/build.json'); (Array.isArray(b)?b[0]:b).id")
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
      - name: Wait for FINISHED
        id: wait
        run: |
          [ -n "$EXPO_TOKEN" ] || unset EXPO_TOKEN
          for i in $(seq 1 160); do
            npx -y eas-cli@latest build:view ${{ steps.build.outputs.id }} --json > "$RUNNER_TEMP/view.json" 2>/dev/null || true
            STATUS=$(node -p "try{JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/view.json','utf8')).status}catch{''}")
            echo "$(date -u +%T) status=$STATUS"
            case "$STATUS" in
              FINISHED) break ;;
              ERRORED|CANCELED) cat "$RUNNER_TEMP/view.json"; exit 1 ;;
            esac
            sleep 30
          done
          [ "$STATUS" = "FINISHED" ] || { echo "::error::build did not finish in time"; exit 1; }
          URL=$(node -p "const a=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/view.json','utf8')).artifacts; a.buildUrl || a.applicationArchiveUrl")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "APK artifact: $URL"
          echo "Build page: https://expo.dev/accounts/${{ steps.who.outputs.account }}/projects/$(node -p "require('./app.json').expo.slug")/builds/${{ steps.build.outputs.id }}"
      - name: Download and verify APK
        run: |
          curl -fsSL -o ucl-match-model.apk "${{ steps.wait.outputs.url }}"
          ls -l ucl-match-model.apk
          MAGIC=$(head -c 2 ucl-match-model.apk)
          echo "first bytes: $MAGIC"
          [ "$MAGIC" = "PK" ] || { echo "::error::downloaded file is not an APK"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ucl-match-model-apk
          path: mobile/ucl-match-model.apk
      - name: Attach to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v$(node -p "require('./app.json').expo.version")-${{ github.run_number }}"
          gh release create "$TAG" ucl-match-model.apk --target "${{ github.sha }}" --title "UCL Match Model Android ($TAG)" \
            --notes "EAS build ${{ steps.build.outputs.id }}. Expo artifact: ${{ steps.wait.outputs.url }}"
