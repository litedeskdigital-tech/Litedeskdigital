name: UEFA probe (temporary)

# Manual-only. Prints compact summaries of UEFA match API responses so the fixture importer can be written
# against real data. To be removed before the importer is merged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          UA: "Litedeskdigital-model/1.0 (+https://github.com/litedeskdigital-tech/Litedeskdigital)"
        run: |
          set +e
          get() { curl -sS -m 30 -A "$UA" -H "Accept: application/json" "$1"; }
          slim='walk(if type=="object" then del(.translations, .images, .bigLogoUrl, .logoUrl, .mediumLogoUrl, .associationLogoUrl) else . end) | del(.playerEvents, .referees, .stadium, .competition, .relatedMatches, .lineupStatus, .condition)'
          M="https://match.uefa.com/v5/matches"
          get "$M?competitionId=1&seasonYear=2027&limit=200&offset=0&order=ASC" > m.json
          echo "count $(jq length m.json)"
          echo "::group::last finished (2027)"; jq -c "[.[] | select(.status==\"FINISHED\")][-1] | $slim" m.json; echo "::endgroup::"
          echo "::group::first not finished (2027)"; jq -c "[.[] | select(.status!=\"FINISHED\")][0] | $slim" m.json; echo "::endgroup::"
          echo "::group::phase/round/status counts"; jq -c '[.[] | {phase: .round.phase, round: .round.metaData.name, status}] | group_by([.phase, .round, .status]) | map(.[0] + {n: length})' m.json; echo "::endgroup::"
          for off in 200 400; do echo "offset $off: $(get "$M?competitionId=1&seasonYear=2027&limit=200&offset=$off&order=ASC" | jq length)"; done
          get "$M?competitionId=1&seasonYear=2026&limit=200&offset=0&order=DESC" > k.json
          echo "::group::2026 latest finished (knockouts, score shapes)"; jq -c "[.[] | select(.status==\"FINISHED\")] | .[0:3][] | $slim" k.json; echo "::endgroup::"
          for c in 14 2019; do
            echo "competition $c 2027: $(get "$M?competitionId=$c&seasonYear=2027&limit=200&offset=0&order=ASC" | jq -c 'if type=="array" then {n: length, finished: ([.[] | select(.status=="FINISHED")] | length)} else . end')"
          done
