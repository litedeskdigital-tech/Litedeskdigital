name: UEFA probe (temporary)

# Manual-only. Runs this branch's update (with the UEFA player importer) and prints what it produced.
# Commits nothing. To be removed before the importer is merged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run update -- --no-tune
      - name: Show importer output
        run: |
          echo "::group::uefa-teams.json"; cat data/uefa-teams.json | head -c 6000; echo; echo "::endgroup::"
          echo "players: $(($(wc -l < data/players.csv) - 1))"
          echo "::group::top of players.csv by rate"; (head -1 data/players.csv; tail -n +2 data/players.csv | sort -t, -k5 -gr | head -25); echo "::endgroup::"
          echo "::group::penalty takers"; grep ',true$' data/players.csv | head -40; echo "::endgroup::"
          echo "::group::report sources + upcoming"; grep -E "^Sources|Bonus scorer|^\| 2026" REPORT.md | head -30; echo "::endgroup::"
